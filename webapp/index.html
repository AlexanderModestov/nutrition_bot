<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Оплата</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://yookassa.ru/checkout-widget/v1/checkout-widget.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color, #000000);
        }

        .product-info {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .product-info h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color, #000000);
        }

        .product-info p {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 32px;
            font-weight: 700;
            color: var(--tg-theme-text-color, #000000);
        }

        #payment-form {
            min-height: 400px;
        }

        .loading {
            text-align: center;
            padding: 40px 0;
            color: var(--tg-theme-hint-color, #999999);
        }

        .spinner {
            border: 3px solid var(--tg-theme-hint-color, #f3f3f3);
            border-top: 3px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💳 Оплата услуги</h1>
        </div>

        <div class="product-info" id="product-info">
            <div class="loading">
                <div class="spinner"></div>
                <p>Загрузка...</p>
            </div>
        </div>

        <div id="payment-form"></div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();

        // Get payment data from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const paymentId = urlParams.get('payment_id');
        const productName = urlParams.get('product_name');
        const productDescription = urlParams.get('product_description');
        const amount = urlParams.get('amount');
        const currency = urlParams.get('currency') || 'RUB';
        // Get return_url from URL parameter (passed by bot) or use default
        const returnUrl = urlParams.get('return_url') || 'https://t.me/AnastasiaSharkova_bot';

        // Display product information
        if (productName && amount) {
            document.getElementById('product-info').innerHTML = `
                <h2>${productName}</h2>
                ${productDescription ? `<p>${productDescription}</p>` : ''}
                <div class="product-price">${amount} ${currency === 'RUB' ? '₽' : currency}</div>
            `;
        }

        // Initialize YooKassa Checkout Widget
        if (paymentId) {
            const checkout = new window.YooMoneyCheckoutWidget({
                confirmation_token: paymentId,
                return_url: returnUrl,

                error_callback: function(error) {
                    console.error('Payment error:', error);

                    document.getElementById('payment-form').innerHTML = `
                        <div class="error">
                            <strong>Ошибка оплаты</strong><br>
                            ${error.error || 'Произошла ошибка при обработке платежа'}
                        </div>
                    `;

                    // Send error to bot
                    tg.sendData(JSON.stringify({
                        status: 'error',
                        payment_id: paymentId,
                        error: error.error || 'Unknown error'
                    }));

                    setTimeout(() => {
                        tg.close();
                    }, 3000);
                },

                // Payment completed successfully
                complete_callback: function(payment) {
                    console.log('Payment completed:', payment);

                    document.getElementById('payment-form').innerHTML = `
                        <div class="success">
                            <strong>✅ Оплата успешна!</strong><br>
                            Спасибо за ваш платеж
                        </div>
                    `;

                    // Send success to bot
                    tg.sendData(JSON.stringify({
                        status: 'success',
                        payment_id: paymentId,
                        payment: payment
                    }));

                    // Auto-close after 2 seconds
                    setTimeout(() => {
                        tg.close();
                    }, 2000);
                }
            });

            // Render the payment form
            checkout.render('payment-form');

        } else {
            document.getElementById('payment-form').innerHTML = `
                <div class="error">
                    <strong>Ошибка</strong><br>
                    Отсутствует ID платежа
                </div>
            `;

            setTimeout(() => {
                tg.close();
            }, 3000);
        }

        // Handle back button
        tg.BackButton.show();
        tg.BackButton.onClick(function() {
            if (confirm('Отменить оплату?')) {
                tg.sendData(JSON.stringify({
                    status: 'canceled',
                    payment_id: paymentId
                }));
                tg.close();
            }
        });
    </script>
</body>
</html>
